# Render.com Blueprint — MedSim
# Bu fayl Render.com da "New Blueprint" bilan barcha xizmatlarni bir vaqtda deploy qiladi

databases:
  - name: medsim-db
    plan: free
    databaseName: medsim_db
    user: medsim
    ipAllowList: []

services:
  # ===== Backend (FastAPI) =====
  - type: web
    name: medsim-backend
    runtime: python
    buildCommand: |
      cd backend && pip install -r requirements.txt
    startCommand: |
      cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medsim-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: STT_API_URL
        value: ""
      - key: TTS_API_URL
        value: ""
      - key: AUDIO_PRESETS_DIR
        value: "static/audio_presets"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ===== Frontend (React — Static Site) =====
  - type: web
    name: medsim-frontend
    runtime: static
    buildCommand: |
      cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: medsim-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

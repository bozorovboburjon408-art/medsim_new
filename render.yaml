services:
  - type: web
    name: medsim-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-2.5-flash
      - key: TTS_PROVIDER
        value: gemini
      - key: GEMINI_TTS_MODELS
        value: gemini-2.5-flash-preview-tts
      - key: GEMINI_API_KEY
        sync: false

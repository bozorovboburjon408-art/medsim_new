services:
  - type: web
    name: medsim-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODELS
        value: gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: TTS_PROVIDER
        value: edge
      - key: GEMINI_API_KEY
        sync: false
